

name: AntiDupl Personal Build

on:
  push:
    branches:
      - a
  workflow_dispatch:


permissions:
  contents: read

env:
  VCPKG_DEFAULT_TRIPLET: x64-windows-static

jobs:
  build:
    runs-on: windows-latest

    env:
      Solution_Name: ./src/AntiDupl.sln

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Read version
        id: version
        shell: pwsh
        run: |
          $version = (Get-Content -LiteralPath "src/version.txt" -Raw).Trim()
          if ([string]::IsNullOrWhiteSpace($version)) {
            throw "src/version.txt is empty."
          }
          "content=$version" >> $env:GITHUB_OUTPUT

      - name: Setup MSBuild.exe
        uses: microsoft/setup-msbuild@v2

      - name: Restore NuGet packages
        run: nuget restore $env:Solution_Name

      - name: Run and cache vcpkg dependencies
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitCommitId: 3b9d086009cc1c2256e9c28ad44a00036fbd9b26
          vcpkgJsonGlob: src/vcpkg.json
          runVcpkgInstall: false

      - name: Integrate vcpkg
        working-directory: ${{ env.VCPKG_ROOT }}
        run: |
          .\vcpkg.exe integrate install

      - name: Build SingleFilePortable
        run: msbuild $env:Solution_Name /p:Configuration=Publish /p:Platform=x64 -restore -t:Publish -p:PublishProfile="AntiDuplPublishSingleFile"

      - name: Package SingleFilePortable
        run: |
          cd cmd
          .\MakePublish.cmd

      - name: Generate SHA-256 checksums
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.content }}
        run: |
          $base = Join-Path $env:GITHUB_WORKSPACE "out\publish\AntiDupl.NET-$($env:VERSION)"

          foreach ($suffix in @("_SingleFilePortable.exe", "_SingleFilePortable.zip")) {
            $file = "$base$suffix"

            if (-not (Test-Path -LiteralPath $file)) {
              throw "File not found: $file"
            }

            $hash = (Get-FileHash -LiteralPath $file -Algorithm SHA256).Hash
            "$hash  $(Split-Path -Leaf $file)" |
              Set-Content -LiteralPath "$file.hash.txt" -Encoding ascii
          }

      - name: Upload SingleFilePortable
        uses: actions/upload-artifact@v7
        with:
          name: AntiDupl.NET-${{ steps.version.outputs.content }}-SingleFilePortable
          path: |
            out/publish/AntiDupl.NET-${{ steps.version.outputs.content }}_SingleFilePortable.exe
            out/publish/AntiDupl.NET-${{ steps.version.outputs.content }}_SingleFilePortable.exe.hash.txt
            out/publish/AntiDupl.NET-${{ steps.version.outputs.content }}_SingleFilePortable.zip
            out/publish/AntiDupl.NET-${{ steps.version.outputs.content }}_SingleFilePortable.zip.hash.txt
          if-no-files-found: error
          retention-days: 30
